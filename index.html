<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Claviq grows revenue with AI: get found on Google and AI search, answer and follow up every lead, and bring customers back. Offices in Orlando, USA and Guwahati, India." />
    <title>Claviq | AI for Revenue Growth: AEO, Sales AI and Retention</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="intro-screen" id="introScreen" aria-label="Claviq loading">
      <div class="intro-orbits" aria-hidden="true"></div>
      <div class="intro-logo">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 3.5C10.887 3.5 3.5 10.887 3.5 20S10.887 36.5 20 36.5" stroke="currentColor" stroke-width="1.5" />
            <path d="M20 10.5C14.753 10.5 10.5 14.753 10.5 20S14.753 29.5 20 29.5" stroke="currentColor" stroke-width="1.5" />
            <circle cx="28.5" cy="20" r="3.5" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-name holo-text">C L A V I Q</span>
      </div>
    </div>

    <div class="page-shell">
      <div class="ambient-glow ambient-glow--one" aria-hidden="true"></div>
      <div class="ambient-glow ambient-glow--two" aria-hidden="true"></div>
      <div class="liquid-cloth-root" id="liquid-cloth-root" aria-hidden="true"></div>
      <div class="background-grain" aria-hidden="true"></div>
      <div class="orb-field" aria-hidden="true">
        <span class="orb orb--large" data-depth="-0.08"></span>
        <span class="orb orb--medium" data-depth="0.16"></span>
        <span class="orb orb--small" data-depth="-0.24"></span>
        <span class="orb orb--halo" data-depth="0.1"></span>
      </div>

      <header class="site-header">
        <a class="brand" href="/" aria-label="Claviq home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 3.5C10.887 3.5 3.5 10.887 3.5 20S10.887 36.5 20 36.5" stroke="currentColor" stroke-width="1.5" />
              <path d="M20 10.5C14.753 10.5 10.5 14.753 10.5 20S14.753 29.5 20 29.5" stroke="currentColor" stroke-width="1.5" />
              <circle cx="28.5" cy="20" r="3.5" fill="currentColor" />
            </svg>
          </span>
          <span class="brand-copy">
            <span class="brand-name holo-text">C L A V I Q</span>
          </span>
        </a>

        <div class="header-actions">
          <a class="talk-bar" href="mailto:hello@claviq.studio">
            <span>LET'S TALK</span>
          </a>
          <span class="location-bar">
            <span>GUWAHATI</span>
            <span class="location-arrow" aria-hidden="true">→</span>
            <span>ORLANDO</span>
          </span>
        </div>
      </header>

      <main>
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-content" id="questionContent" aria-hidden="true">
            <h1 class="hero-title" id="hero-title">
              <a class="hero-line hero-line--who" id="question-who" href="#about">Who are we ?</a>
              <a class="hero-line hero-line--main holo-text" id="question-what" href="#services">WHAT WE DO?</a>
              <span class="hero-line hero-line--help" id="question-help">How can we help?</span>
            </h1>
          </div>
        </section>
      </main>

      <div class="route-page" id="routePage" hidden aria-hidden="true">
        <div class="route-page__inner" id="routePageContent"></div>
      </div>

      <div class="menu-area">
        <nav class="menu-panel" id="menuPanel" aria-label="Page options" hidden>
          <a href="#home">
            <span>HOME</span>
            <small>00</small>
          </a>
          <a href="#about">
            <span>ABOUT</span>
            <small>01</small>
          </a>
          <a href="#services">
            <span>SERVICES</span>
            <small>02</small>
          </a>
          <a href="#industries">
            <span>INDUSTRIES</span>
            <small>03</small>
          </a>
          <a href="#ai-revenue-audit">
            <span>AI REVENUE AUDIT</span>
            <small>04</small>
          </a>
          <a class="menu-contact" href="#contact">
            <span>CONTACT US</span>
            <small>05</small>
          </a>
        </nav>

        <button class="menu-trigger" id="menuTrigger" type="button" aria-expanded="false" aria-controls="menuPanel">
          <span class="menu-icon" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span class="sr-only">Open menu</span>
        </button>
      </div>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
